<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/event-carousel.css?v=2" />
    <link rel="stylesheet" href="/developer-mode.css?v=1" />
    <style>
      .html-boot{min-height:100dvh;display:grid;place-items:center;background:#f2f2f7;color:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .html-boot span{display:block;width:28px;height:28px;margin:auto;border:3px solid #d1d1d6;border-top-color:#007aff;border-radius:50%;animation:html-boot-spin .8s linear infinite}
      .html-boot p{margin:12px 0 0;font-size:14px;font-weight:600}
      @keyframes html-boot-spin{to{transform:rotate(360deg)}}
    </style>
    <title>เทศบาลนครเชียงราย</title>
  </head>
  <body>
    <div id="app"><div class="html-boot" role="status"><div><span aria-hidden="true"></span><p>กำลังเปิดบริการเทศบาล...</p></div></div></div>
    <noscript>กรุณาเปิดใช้งาน JavaScript เพื่อใช้บริการเทศบาลนครเชียงราย</noscript>
    <script type="module" src="/src/main.ts"></script>
    <script defer src="/event-carousel.js?v=2"></script>
    <script defer src="/developer-mode.js?v=1"></script>
  </body>
</html>
