name: Add performance monitor

on:
  push:
    branches: [feature/home-event-carousel]

permissions:
  contents: write

jobs:
  monitor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch source
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')

          perf = root / 'src/services/performance.ts'
          perf.write_text('''export type MetricKey = 'appStart' | 'firstRender' | 'liffReady' | 'hydration' | 'weather' | 'leaflet' | 'mapReady';\n\nexport type Metric = { key: MetricKey; label: string; target: number; value: number | null };\n\nconst startedAt = performance.now();\nconst values = new Map<MetricKey, number>();\n\nconst definitions: Array<Omit<Metric, 'value'>> = [\n  { key: 'appStart', label: 'App Start', target: 500 },\n  { key: 'firstRender', label: 'First Render', target: 500 },\n  { key: 'liffReady', label: 'LIFF Ready', target: 1500 },\n  { key: 'hydration', label: 'Data Hydrated', target: 2000 },\n  { key: 'weather', label: 'Weather Ready', target: 3500 },\n  { key: 'leaflet', label: 'Leaflet Loaded', target: 2500 },\n  { key: 'mapReady', label: 'Map Ready', target: 3500 }\n];\n\nexport function mark(key: MetricKey): void {\n  if (!values.has(key)) values.set(key, Math.round(performance.now() - startedAt));\n}\n\nexport function getMetrics(): Metric[] {\n  return definitions.map(def => ({ ...def, value: values.get(def.key) ?? null }));\n}\n\nexport function reset(): void {\n  values.clear();\n}\n\nmark('appStart');\n''', encoding='utf-8')

          main = root / 'src/main.ts'
          text = main.read_text(encoding='utf-8')

          if "from './services/performance'" not in text:
              text = text.replace("import { loadLeaflet } from './services/leafletLoader';", "import { loadLeaflet } from './services/leafletLoader';\nimport { getMetrics, mark, reset } from './services/performance';", 1)

          if 'function performancePage()' not in text:
              anchor = 'function settingsPage(): string {'
              page = '''function performancePage(): string {\n  const metrics = getMetrics();\n  const rows = metrics.map(metric => {\n    const value = metric.value == null ? '—' : `${metric.value} ms`;\n    const status = metric.value == null ? '' : metric.value <= metric.target ? 'ผ่าน' : 'ช้า';\n    return `<div class="perf-row"><div><b>${esc(metric.label)}</b><small>เป้าหมาย ≤ ${metric.target} ms</small></div><strong>${esc(value)}</strong><span class="perf-status ${status === 'ผ่าน' ? 'ok' : status ? 'slow' : ''}">${esc(status)}</span></div>`;\n  }).join('');\n  return shell(`\n    <div class="page-heading"><h1>Performance Monitor</h1><p>วัดความเร็วของแอปจากเครื่องและเครือข่ายนี้</p></div>\n    <section class="performance-card">${rows}</section>\n    <div class="performance-actions"><button class="secondary-button" id="perf-refresh">รีเฟรช</button><button class="secondary-button" id="perf-reset">ล้างค่า</button></div>\n    <div class="demo-banner">ค่าที่แสดงเป็น milliseconds (ms) และเก็บไว้เฉพาะ session นี้</div>\n  `, 'settings', { title: 'Performance Monitor', back: true });\n}\n\n'''
              if anchor not in text:
                  raise SystemExit('settings function not found')
              text = text.replace(anchor, page + anchor, 1)

          settings_anchor = '<section class="settings-group"><h3>เกี่ยวกับ</h3><div class="ios-list">'
          if 'data-go="performance"' not in text:
              settings_block = '''<section class="settings-group"><h3>นักพัฒนา</h3><div class="ios-list">\n      <button class="ios-list-item" data-go="performance"><span class="setting-icon blue">⚡</span><span class="list-copy"><b>Performance Monitor</b><small>ตรวจสอบความเร็วของแอป</small></span><span class="chevron">${icons.chevron}</span></button>\n    </div></section>\n    ''' + settings_anchor
              if settings_anchor not in text:
                  raise SystemExit('about settings anchor not found')
              text = text.replace(settings_anchor, settings_block, 1)

          render_anchor = "  else if (current === 'settings') app.innerHTML = settingsPage();"
          if "current === 'performance'" not in text:
              text = text.replace(render_anchor, render_anchor + "\n  else if (current === 'performance') app.innerHTML = performancePage();", 1)

          text = text.replace("  const weather = await getChiangRaiWeather();\n  if (!weather || route() !== 'home') return;", "  const weather = await getChiangRaiWeather();\n  if (!weather || route() !== 'home') return;\n  mark('weather');", 1)
          text = text.replace("  await loadLeaflet();\n  const container", "  await loadLeaflet();\n  mark('leaflet');\n  const container", 1)
          text = text.replace("  if (pendingMapFocus) {", "  mark('mapReady');\n  if (pendingMapFocus) {", 1)
          text = text.replace("  profile = nextProfile;\n  [services, news, notices] = nextData;", "  mark('liffReady');\n  profile = nextProfile;\n  [services, news, notices] = nextData;", 1)
          text = text.replace("  [services, news, notices] = nextData;\n\n  const current", "  [services, news, notices] = nextData;\n  mark('hydration');\n\n  const current", 1)
          text = text.replace("  await render();\n  void hydrateApp().catch(error => {", "  await render();\n  mark('firstRender');\n  void hydrateApp().catch(error => {", 1)

          bind_anchor = "  document.querySelector('#share-btn')?.addEventListener('click', async () => {"
          bind_block = '''  document.querySelector('#perf-refresh')?.addEventListener('click', () => void render());\n  document.querySelector('#perf-reset')?.addEventListener('click', () => {\n    reset();\n    toast('ล้างค่าการวัดแล้ว เปิด Performance Monitor ใหม่หลังรีโหลดแอป');\n    void render();\n  });\n\n'''
          if '#perf-refresh' not in text:
              if bind_anchor not in text:
                  raise SystemExit('share button anchor not found')
              text = text.replace(bind_anchor, bind_block + bind_anchor, 1)

          main.write_text(text, encoding='utf-8')

          styles = root / 'src/styles.css'
          css = styles.read_text(encoding='utf-8')
          if '/* Performance Monitor */' not in css:
              css += '''\n\n/* Performance Monitor */\n.performance-card{background:var(--card-bg,#fff);border-radius:20px;overflow:hidden;border:1px solid rgba(0,0,0,.06)}\n.perf-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06)}\n.perf-row:last-child{border-bottom:0}.perf-row b{display:block}.perf-row small{display:block;color:#8e8e93;margin-top:3px}.perf-row strong{font-variant-numeric:tabular-nums}.perf-status{min-width:42px;text-align:right;font-size:12px}.perf-status.ok{color:#34c759}.perf-status.slow{color:#ff3b30}.performance-actions{display:flex;gap:10px;margin-top:14px}.performance-actions .secondary-button{flex:1}\n'''
              styles.write_text(css, encoding='utf-8')
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/styles.css src/services/performance.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add in-app performance monitor'
          git push origin HEAD:${GITHUB_REF_NAME}
