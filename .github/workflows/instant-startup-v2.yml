name: Instant startup v2

on:
  push:
    branches:
      - feature/home-event-carousel

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Leaflet is not part of the Home critical path.
          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')
          s = s.replace('    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />\n', '')
          s = s.replace('    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>\n', '')
          index.write_text(s, encoding='utf-8')

          # LIFF redirect env typing.
          env = root / 'src/vite-env.d.ts'
          s = env.read_text(encoding='utf-8')
          if 'VITE_LIFF_REDIRECT_URI' not in s:
              s = s.replace('  readonly VITE_LIFF_ID?: string;\n', '  readonly VITE_LIFF_ID?: string;\n  readonly VITE_LIFF_REDIRECT_URI?: string;\n', 1)
          env.write_text(s, encoding='utf-8')

          # Create the real TypeScript Leaflet loader.
          loader = root / 'src/services/leafletLoader.ts'
          loader.write_text('''type LeafletWindow = Window & { L?: any };\n\nconst JS_URL = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';\nconst CSS_URL = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';\n\nlet pending: Promise<void> | null = null;\n\nfunction loadCss(): Promise<void> {\n  if (document.querySelector('link[data-leaflet-lazy="true"]')) return Promise.resolve();\n  return new Promise((resolve, reject) => {\n    const link = document.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = CSS_URL;\n    link.dataset.leafletLazy = 'true';\n    link.onload = () => resolve();\n    link.onerror = () => reject(new Error('Leaflet CSS failed to load'));\n    document.head.appendChild(link);\n  });\n}\n\nfunction loadJs(): Promise<void> {\n  const win = window as LeafletWindow;\n  if (win.L) return Promise.resolve();\n  return new Promise((resolve, reject) => {\n    const script = document.createElement('script');\n    script.src = JS_URL;\n    script.async = true;\n    script.dataset.leafletLazy = 'true';\n    script.onload = () => resolve();\n    script.onerror = () => reject(new Error('Leaflet JS failed to load'));\n    document.head.appendChild(script);\n  });\n}\n\nexport async function loadLeaflet(): Promise<void> {\n  const win = window as LeafletWindow;\n  if (win.L) return;\n  if (!pending) {\n    pending = Promise.all([loadCss(), loadJs()]).then(() => {\n      if (!win.L) throw new Error('Leaflet loaded without global L');\n    }).finally(() => {\n      pending = null;\n    });\n  }\n  await pending;\n}\n''', encoding='utf-8')

          main = root / 'src/main.ts'
          s = main.read_text(encoding='utf-8')

          old = "import { categoryTitle, createComplaint, getMapIssues, getNews, getNotices, getServices } from './services/repository';"
          new = "import { categoryTitle, createComplaint, demoNews, demoNotices, demoServices, getMapIssues, getNews, getNotices, getServices } from './services/repository';"
          if old in s:
              s = s.replace(old, new, 1)
          if "from './services/leafletLoader'" not in s:
              s = s.replace("import { getChiangRaiWeather } from './services/weather';", "import { getChiangRaiWeather } from './services/weather';\nimport { loadLeaflet } from './services/leafletLoader';", 1)

          old = "let profile: UserProfile;\nlet services: ServiceItem[] = [];\nlet news: NewsItem[] = [];\nlet notices: NoticeItem[] = [];"
          new = "let profile: UserProfile = { userId: 'startup-user', displayName: 'ผู้ใช้งาน', statusMessage: 'กำลังโหลดข้อมูล', isDemo: true };\nlet services: ServiceItem[] = [...demoServices];\nlet news: NewsItem[] = [...demoNews];\nlet notices: NoticeItem[] = [...demoNotices];"
          if old not in s:
              raise SystemExit('state anchor missing')
          s = s.replace(old, new, 1)

          old = "async function initMap(): Promise<void> {\n  const container = document.querySelector<HTMLDivElement>('#map');"
          new = "async function initMap(): Promise<void> {\n  await loadLeaflet();\n  const container = document.querySelector<HTMLDivElement>('#map');"
          if old not in s:
              raise SystemExit('map anchor missing')
          s = s.replace(old, new, 1)

          pattern = re.compile(r"async function start\(\): Promise<void> \{.*?\n\}\n\nvoid start\(\);", re.S)
          replacement = '''async function hydrateApp(): Promise<void> {\n  const [nextProfile, nextData] = await Promise.all([\n    initLine(),\n    Promise.all([getServices(), getNews(), getNotices()])\n  ]);\n\n  profile = nextProfile;\n  [services, news, notices] = nextData;\n\n  const current = route();\n  if (current === 'home' || current === 'services') {\n    await render();\n  }\n}\n\nasync function start(): Promise<void> {\n  document.documentElement.classList.toggle('dark', localStorage.getItem('dark-mode') === 'true');\n  window.addEventListener('hashchange', () => void render());\n\n  // Critical path: render the UI immediately from bundled fallback data.\n  // LIFF and Supabase hydrate after first paint and never block startup.\n  await render();\n  void hydrateApp().catch(error => {\n    console.warn('Background startup hydration failed:', error);\n  });\n}\n\nvoid start();'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('start block missing')
          main.write_text(s2, encoding='utf-8')

          repo = root / 'src/services/repository.ts'
          s = repo.read_text(encoding='utf-8')
          s = s.replace("async function withReadTimeout<T>(query: { abortSignal: (signal: AbortSignal) => PromiseLike<T> }): Promise<T> {\n  const controller = new AbortController();\n  const timer = window.setTimeout(() => controller.abort(), READ_TIMEOUT_MS);\n  try {\n    return await query.abortSignal(controller.signal);\n  } finally {\n    window.clearTimeout(timer);\n  }\n}", """async function withReadTimeout<T>(query: any): Promise<T> {\n  const controller = new AbortController();\n  const timer = window.setTimeout(() => controller.abort(), READ_TIMEOUT_MS);\n  try {\n    const request = typeof query?.abortSignal === 'function'\n      ? query.abortSignal(controller.signal)\n      : query;\n    const timeout = new Promise<never>((_, reject) => {\n      window.setTimeout(() => reject(new Error('Public read timeout')), READ_TIMEOUT_MS);\n    });\n    return await Promise.race([request, timeout]) as T;\n  } finally {\n    window.clearTimeout(timer);\n  }\n}""", 1)
          # Explicit response types keep TS inference stable.
          s = s.replace("const { data, error } = await withReadTimeout(\n      supabase.from('services')", "const { data, error } = await withReadTimeout<{ data: ServiceItem[] | null; error: unknown }>(\n      supabase.from('services')", 1)
          s = s.replace("const { data, error } = await withReadTimeout(\n      supabase.from('notices')", "const { data, error } = await withReadTimeout<{ data: NoticeItem[] | null; error: unknown }>(\n      supabase.from('notices')", 1)
          s = s.replace("const { data, error } = await withReadTimeout(\n      supabase.from('news')", "const { data, error } = await withReadTimeout<{ data: NewsItem[] | null; error: unknown }>(\n      supabase.from('news')", 1)
          s = s.replace("const { data, error } = await withReadTimeout(\n      supabase.rpc('get_public_map_issues')", "const { data, error } = await withReadTimeout<{ data: unknown; error: unknown }>(\n      supabase.rpc('get_public_map_issues')", 1)
          repo.write_text(s, encoding='utf-8')

          # Remove superseded temporary workflows from the working tree.
          for wf in [root / '.github/workflows/fast-startup.yml', root / '.github/workflows/optimize-startup.yml', root / '.github/workflows/instant-startup-v2.yml']:
              if wf.exists():
                  wf.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit optimized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "perf: instant startup with background hydration"
          git push origin HEAD:${GITHUB_REF_NAME}
