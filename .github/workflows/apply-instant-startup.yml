name: Apply instant startup optimization

on:
  push:
    branches: [feature/home-event-carousel]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply safe source patches
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # index.html: keep only truly necessary scripts on the critical path.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>\n', '    <script async src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>\n')
          text = text.replace('    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n', '    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n')
          # Leaflet is loaded only on the map route by TypeScript loader.
          text = re.sub(r'    <script src="/leaflet-lazy\.js"></script>\n', '', text)
          text = re.sub(r'    <link rel="stylesheet" href="/leaflet-lazy\.css"[^>]*>\n', '', text)
          index.write_text(text, encoding='utf-8')

          # Ensure env typing matches config.ts.
          env = Path('src/vite-env.d.ts')
          text = env.read_text(encoding='utf-8')
          if 'VITE_LIFF_REDIRECT_URI' not in text:
              text = text.replace('  readonly VITE_LIFF_ID?: string;\n', '  readonly VITE_LIFF_ID?: string;\n  readonly VITE_LIFF_REDIRECT_URI?: string;\n', 1)
          env.write_text(text, encoding='utf-8')

          # Provide a real TypeScript Leaflet loader.
          loader = Path('src/services/leafletLoader.ts')
          loader.write_text('''type LeafletWindow = Window & { L?: any };
          const JS_URL = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          const CSS_URL = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
          let loading: Promise<void> | null = null;

          function loadCss(): Promise<void> {
            if (document.querySelector('link[data-leaflet-loader]')) return Promise.resolve();
            return new Promise((resolve, reject) => {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = CSS_URL;
              link.dataset.leafletLoader = 'true';
              link.onload = () => resolve();
              link.onerror = () => reject(new Error('Leaflet CSS failed to load'));
              document.head.appendChild(link);
            });
          }

          function loadJs(): Promise<void> {
            const win = window as LeafletWindow;
            if (win.L) return Promise.resolve();
            return new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = JS_URL;
              script.async = true;
              script.dataset.leafletLoader = 'true';
              script.onload = () => resolve();
              script.onerror = () => reject(new Error('Leaflet JS failed to load'));
              document.head.appendChild(script);
            });
          }

          export function loadLeaflet(): Promise<void> {
            const win = window as LeafletWindow;
            if (win.L) return Promise.resolve();
            if (!loading) {
              loading = Promise.all([loadCss(), loadJs()]).then(() => {
                if (!win.L) throw new Error('Leaflet did not expose window.L');
              }).finally(() => { loading = null; });
            }
            return loading;
          }
          ''', encoding='utf-8')

          # main.ts: use bundled fallback for instant first paint and hydrate afterwards.
          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          repo_import = "import { categoryTitle, createComplaint, getMapIssues, getNews, getNotices, getServices } from './services/repository';"
          if repo_import in text:
              text = text.replace(repo_import, "import { categoryTitle, createComplaint, demoNews, demoNotices, demoServices, getMapIssues, getNews, getNotices, getServices } from './services/repository';", 1)
          state = "let profile: UserProfile;\nlet services: ServiceItem[] = [];\nlet news: NewsItem[] = [];\nlet notices: NoticeItem[] = [];"
          fallback = "let profile: UserProfile = { userId: 'startup-user', displayName: 'ผู้ใช้งาน', statusMessage: 'กำลังโหลดข้อมูล', isDemo: true };\nlet services: ServiceItem[] = [...demoServices];\nlet news: NewsItem[] = [...demoNews];\nlet notices: NoticeItem[] = [...demoNotices];"
          if state in text:
              text = text.replace(state, fallback, 1)
          if "from './services/leafletLoader'" not in text:
              text = text.replace("import { getChiangRaiWeather } from './services/weather';", "import { getChiangRaiWeather } from './services/weather';\nimport { loadLeaflet } from './services/leafletLoader';", 1)
          init_map = "async function initMap(): Promise<void> {\n  const container = document.querySelector<HTMLDivElement>('#map');"
          if init_map in text:
              text = text.replace(init_map, "async function initMap(): Promise<void> {\n  await loadLeaflet();\n  const container = document.querySelector<HTMLDivElement>('#map');", 1)

          old_start = re.search(r"async function start\(\): Promise<void> \{[\s\S]*?\n\}\n\nvoid start\(\);", text)
          if not old_start:
              raise SystemExit('start() block not found')
          new_start = '''async function hydrateApp(): Promise<void> {
            const [nextProfile, nextData] = await Promise.all([
              initLine(),
              Promise.all([getServices(), getNews(), getNotices()])
            ]);
            profile = nextProfile;
            [services, news, notices] = nextData;
            const current = route();
            if (current === 'home' || current === 'services') await render();
          }

          async function start(): Promise<void> {
            document.documentElement.classList.toggle('dark', localStorage.getItem('dark-mode') === 'true');
            window.addEventListener('hashchange', () => void render());
            await render();
            void hydrateApp().catch(error => console.warn('Background startup hydration failed:', error));
          }

          void start();'''
          text = text[:old_start.start()] + new_start + text[old_start.end():]
          main.write_text(text, encoding='utf-8')

          # supabase.ts: expose a live binding and refresh it once the deferred CDN SDK is ready.
          supa = Path('src/services/supabase.ts')
          text = supa.read_text(encoding='utf-8')
          old = '''export const supabase: SupabaseClientLike | null = isSupabaseConfigured && window.supabase
  ? window.supabase.createClient(env.supabaseUrl, env.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true }
    })
  : null;'''
          new = '''let client: SupabaseClientLike | null = null;

          export function refreshSupabase(): SupabaseClientLike | null {
            if (client || !isSupabaseConfigured || !window.supabase) return client;
            client = window.supabase.createClient(env.supabaseUrl, env.supabaseAnonKey, {
              auth: { persistSession: true, autoRefreshToken: true }
            });
            return client;
          }

          export let supabase: SupabaseClientLike | null = null;

          refreshSupabase();'''
          if old not in text:
              # Support previous partially edited variants by replacing the const block.
              text = re.sub(r'export const supabase:[\s\S]*?\n  : null;\n?', new + '\n', text, count=1)
          else:
              text = text.replace(old, new, 1)
          supa.write_text(text, encoding='utf-8')

          # liff.ts: wait briefly for the async LIFF SDK instead of making SDK load block first paint.
          liff = Path('src/services/liff.ts')
          text = liff.read_text(encoding='utf-8')
          marker = "function hasLiff(): boolean {\n  return typeof liff !== 'undefined';\n}\n"
          helper = '''function waitForLiff(timeoutMs = 2500): Promise<boolean> {
            if (hasLiff()) return Promise.resolve(true);
            const started = Date.now();
            return new Promise(resolve => {
              const timer = window.setInterval(() => {
                if (hasLiff()) {
                  window.clearInterval(timer);
                  resolve(true);
                } else if (Date.now() - started >= timeoutMs) {
                  window.clearInterval(timer);
                  resolve(false);
                }
              }, 50);
            });
          }
          '''
          if 'function waitForLiff(' not in text:
              text = text.replace(marker, marker + '\n' + helper, 1)
          text = text.replace("  if (env.forceDemo || !env.liffId || !hasLiff() || shouldSkipWebLiff()) return demoProfile;\n\n  try {", "  if (env.forceDemo || !env.liffId) return demoProfile;\n\n  try {\n    if (!(await waitForLiff())) return demoProfile;\n    if (shouldSkipWebLiff()) return demoProfile;", 1)
          liff.write_text(text, encoding='utf-8')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit only after build passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-instant-startup.yml
          git add index.html src/main.ts src/services/supabase.ts src/services/liff.ts src/services/leafletLoader.ts src/vite-env.d.ts .github/workflows/apply-instant-startup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'perf: instant startup with background hydration'
          git push origin HEAD:${GITHUB_REF_NAME}
