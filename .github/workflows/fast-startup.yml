name: Fast startup optimization

on:
  push:
    branches:
      - feature/home-event-carousel

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Patch startup safely
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Keep Leaflet completely out of the initial HTML critical path.
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />\n', '')
          text = text.replace('    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>\n', '')
          index.write_text(text, encoding='utf-8')

          # Type declaration for the optional redirect URI.
          env_file = root / 'src/vite-env.d.ts'
          text = env_file.read_text(encoding='utf-8')
          if 'VITE_LIFF_REDIRECT_URI' not in text:
              text = text.replace('  readonly VITE_LIFF_ID?: string;\n', '  readonly VITE_LIFF_ID?: string;\n  readonly VITE_LIFF_REDIRECT_URI?: string;\n', 1)
              env_file.write_text(text, encoding='utf-8')

          # Real TypeScript Leaflet loader used only by the Map route.
          loader = root / 'src/services/leafletLoader.ts'
          loader.write_text('''type WindowWithLeaflet = Window & { L?: any };\n\nconst LEAFLET_JS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";\nconst LEAFLET_CSS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";\n\nlet loading: Promise<void> | null = null;\n\nfunction loadCss(): Promise<void> {\n  if (document.querySelector('link[data-leaflet-lazy="true"]')) return Promise.resolve();\n  return new Promise((resolve, reject) => {\n    const link = document.createElement('link');\n    link.rel = 'stylesheet';\n    link.href = LEAFLET_CSS;\n    link.dataset.leafletLazy = 'true';\n    link.onload = () => resolve();\n    link.onerror = () => reject(new Error('Leaflet CSS failed to load'));\n    document.head.appendChild(link);\n  });\n}\n\nfunction loadScript(): Promise<void> {\n  const win = window as WindowWithLeaflet;\n  if (win.L) return Promise.resolve();\n  return new Promise((resolve, reject) => {\n    const script = document.createElement('script');\n    script.src = LEAFLET_JS;\n    script.async = true;\n    script.dataset.leafletLazy = 'true';\n    script.onload = () => resolve();\n    script.onerror = () => reject(new Error('Leaflet JS failed to load'));\n    document.head.appendChild(script);\n  });\n}\n\nexport async function loadLeaflet(): Promise<void> {\n  const win = window as WindowWithLeaflet;\n  if (win.L) return;\n  if (!loading) {\n    loading = Promise.all([loadCss(), loadScript()]).then(() => {\n      if (!win.L) throw new Error('Leaflet loaded without global L');\n    }).finally(() => {\n      loading = null;\n    });\n  }\n  await loading;\n}\n''', encoding='utf-8')

          # Main startup: render from bundled fallback data first, hydrate network data in background.
          main = root / 'src/main.ts'
          text = main.read_text(encoding='utf-8')
          repo_import = "import { categoryTitle, createComplaint, getMapIssues, getNews, getNotices, getServices } from './services/repository';"
          if repo_import in text:
              text = text.replace(repo_import, "import { categoryTitle, createComplaint, demoNews, demoNotices, demoServices, getMapIssues, getNews, getNotices, getServices } from './services/repository';", 1)
          if "from './services/leafletLoader'" not in text:
              text = text.replace("import { getChiangRaiWeather } from './services/weather';", "import { getChiangRaiWeather } from './services/weather';\nimport { loadLeaflet } from './services/leafletLoader';", 1)

          old_state = "let profile: UserProfile;\nlet services: ServiceItem[] = [];\nlet news: NewsItem[] = [];\nlet notices: NoticeItem[] = [];"
          new_state = "let profile: UserProfile = { userId: 'startup-user', displayName: 'ผู้ใช้งาน', statusMessage: 'กำลังโหลดข้อมูล', isDemo: true };\nlet services: ServiceItem[] = [...demoServices];\nlet news: NewsItem[] = [...demoNews];\nlet notices: NoticeItem[] = [...demoNotices];"
          if old_state in text:
              text = text.replace(old_state, new_state, 1)

          old_map = "async function initMap(): Promise<void> {\n  const container = document.querySelector<HTMLDivElement>('#map');"
          new_map = "async function initMap(): Promise<void> {\n  await loadLeaflet();\n  const container = document.querySelector<HTMLDivElement>('#map');"
          if old_map in text:
              text = text.replace(old_map, new_map, 1)

          old_start = """async function start(): Promise<void> {
            document.documentElement.classList.toggle('dark', localStorage.getItem('dark-mode') === 'true');
            app.innerHTML = '<div class=\"loading\"><span class=\"spinner\"></span><p>กำลังเปิดบริการเทศบาล...</p></div>';
            profile = await initLine();
            try {
              [services, news, notices] = await Promise.all([getServices(), getNews(), getNotices()]);
            } catch (error) {
              console.error(error);
              services = [];
              news = [];
              notices = [];
              toast('เชื่อม Supabase ไม่สำเร็จ กรุณาตรวจสอบตารางและ RLS');
            }
            window.addEventListener('hashchange', () => void render());
            await render();
          }

          void start();"""
          new_start = """async function hydrateApp(): Promise<void> {
            const [nextProfile, nextData] = await Promise.all([
              initLine(),
              Promise.all([getServices(), getNews(), getNotices()])
            ]);

            profile = nextProfile;
            [services, news, notices] = nextData;

            const current = route();
            if (current === 'home' || current === 'services') {
              await render();
            }
          }

          async function start(): Promise<void> {
            document.documentElement.classList.toggle('dark', localStorage.getItem('dark-mode') === 'true');
            window.addEventListener('hashchange', () => void render());

            // Critical path: render immediately from bundled fallback data.
            // Network-bound LIFF/Supabase work happens after first paint.
            await render();
            void hydrateApp().catch(error => {
              console.warn('Background startup hydration failed:', error);
            });
          }

          void start();"""
          if old_start not in text:
              raise SystemExit('start() block not found')
          text = text.replace(old_start, new_start, 1)
          main.write_text(text, encoding='utf-8')

          # Fix Supabase timeout helper typing and support both query builders and promises.
          repo = root / 'src/services/repository.ts'
          text = repo.read_text(encoding='utf-8')
          old_helper = """async function withReadTimeout<T>(query: { abortSignal: (signal: AbortSignal) => PromiseLike<T> }): Promise<T> {
  const controller = new AbortController();
  const timer = window.setTimeout(() => controller.abort(), READ_TIMEOUT_MS);
  try {
    return await query.abortSignal(controller.signal);
  } finally {
    window.clearTimeout(timer);
  }
}"""
          new_helper = """async function withReadTimeout<T>(query: any): Promise<T> {
  const controller = new AbortController();
  const timer = window.setTimeout(() => controller.abort(), READ_TIMEOUT_MS);
  try {
    const request = typeof query?.abortSignal === 'function'
      ? query.abortSignal(controller.signal)
      : query;
    const timeout = new Promise<never>((_, reject) => {
      window.setTimeout(() => reject(new Error('Public read timeout')), READ_TIMEOUT_MS);
    });
    return await Promise.race([request, timeout]) as T;
  } finally {
    window.clearTimeout(timer);
  }
}"""
          if old_helper in text:
              text = text.replace(old_helper, new_helper, 1)
          repo.write_text(text, encoding='utf-8')

          # Verify required source changes before the build step.
          assert 'loadLeaflet' in main.read_text(encoding='utf-8')
          assert 'VITE_LIFF_REDIRECT_URI' in env_file.read_text(encoding='utf-8')
          assert 'demoServices' in main.read_text(encoding='utf-8')
          assert "select('id,slug,title,subtitle,icon,color,enabled,sort_order')" in repo.read_text(encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit optimized startup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fast-startup.yml
          git add index.html src/main.ts src/services/leafletLoader.ts src/services/repository.ts src/vite-env.d.ts .github/workflows/fast-startup.yml
          git diff --cached --quiet && exit 0
          git commit -m "perf: make startup render before network hydration"
          git push origin HEAD:${GITHUB_REF_NAME}
